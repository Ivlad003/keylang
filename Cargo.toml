[workspace]
resolver = "3"
members = ["crates/keylang-core", "crates/keylang"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
keylang-core = { path = "crates/keylang-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
